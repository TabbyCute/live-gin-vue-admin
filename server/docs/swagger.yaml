    post:
      consumes:
      - application/json
      description: |-
        agencyId=0 表示移出公会并清空加入时间；加入或更换公会会把加入时间更新为当前毫秒时间戳。
        当前代码库尚无 Agency 模型，本接口不创建虚假公会表或外键；接入公会模块后需补充存在性和状态校验。
      parameters:
      - description: 主播 ID 和目标公会 ID
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorAgencyUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播公会归属
      tags:
      - LiveAnchorAdmin
  /live/anchor/audit:
    post:
      consumes:
      - application/json
      description: |-
        只允许审核中的申请流转到通过(2)或拒绝(3)，不能重复审核或把已通过申请改为拒绝。
        拒绝时 rejectReason 必填并关闭直播/PK 权限；通过时清空拒绝原因，但第一版审核与业务权限分离，不自动开启直播、PK、提现权限。
        auditUserId 从当前管理后台 JWT 获取，审核时间使用毫秒时间戳。
      parameters:
      - description: 主播 ID、目标申请状态和拒绝原因
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorAuditReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限、状态流转非法或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 审核主播申请
      tags:
      - LiveAnchorAdmin
  /live/anchor/cert/update:
    post:
      consumes:
      - application/json
      description: |-
        只修改认证状态、类型和展示名称；证件号、证件图片等认证资料不存入 LiveAnchor。
        未认证(0)要求 certType=0 且 certName 为空；认证中(1)/已认证(2)要求类型非 0；已认证还要求展示名称非空。
      parameters:
      - description: 主播认证状态、类型和展示名
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorCertUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限、认证状态不一致或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播认证状态
      tags:
      - LiveAnchorAdmin
  /live/anchor/detail:
    get:
      description: |-
        根据 anchorId 返回资料、审核、认证、状态、权限、运营、统计、来源、风控、备注和扩展信息。
        使用独立后台 Response DTO，不直接返回 GORM Model，避免模型新增字段后意外泄露。
      parameters:
      - description: 主播 ID
        in: query
        name: anchorId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取主播后台完整详情
      tags:
      - LiveAnchorAdmin
  /live/anchor/list:
    get:
      description: |-
        支持主播 ID/编号/用户 ID、昵称、类型、分类、公会、审核/认证/账号/权限/风控状态、来源、渠道和创建日期筛选。
        仅主播编号和昵称使用 LIKE，不使用 CONCAT 或跨字段全模糊查询；默认按 id DESC 排序。
        当前列表不关联查询用户或公会表，不产生 N+1 查询。
      parameters:
      - description: 页码，从 1 开始
        in: query
        name: page
        required: true
        type: integer
      - description: 每页数量，最大 100
        in: query
        name: pageSize
        required: true
        type: integer
      - description: 主播 ID
        in: query
        name: anchorId
        type: integer
      - description: 主播编号，模糊匹配
        in: query
        name: anchorNo
        type: string
      - description: 客户端用户 ID
        in: query
        name: userId
        type: integer
      - description: 主播昵称，模糊匹配
        in: query
        name: nickname
        type: string
      - description: 主播类型：0普通 1官方 2内部运营
        in: query
        name: anchorType
        type: integer
      - description: 直播分类 ID
        in: query
        name: categoryId
        type: integer
      - description: 公会 ID
        in: query
        name: agencyId
        type: integer
      - description: 申请状态：0未申请 1审核中 2通过 3拒绝
        in: query
        name: applyStatus
        type: integer
      - description: 认证状态：0未认证 1认证中 2已认证 3失败
        in: query
        name: certStatus
        type: integer
      - description: 账号状态：0禁用 1正常 2封禁 3注销
        in: query
        name: status
        type: integer
      - description: 开播权限：0禁止 1允许
        in: query
        name: livePermission
        type: integer
      - description: PK 权限：0禁止 1允许
        in: query
        name: pkPermission
        type: integer
      - description: 推荐准入权限：0禁止 1允许
        in: query
        name: recommendPermission
        type: integer
      - description: 运营提现权限：0禁止 1允许
        in: query
        name: withdrawPermission
        type: integer
      - description: 是否签约：0否 1是
        in: query
        name: isSigned
        type: integer
      - description: 是否人工推荐：0否 1是
        in: query
        name: isRecommended
        type: integer
      - description: 风险等级：0正常 1低 2中 3高
        in: query
        name: riskLevel
        type: integer
      - description: 来源
        in: query
        name: source
        type: string
      - description: 渠道 ID
        in: query
        name: channelId
        type: integer
      - description: 创建日期起，YYYY-MM-DD
        in: query
        name: createdAtStart
        type: string
      - description: 创建日期止，YYYY-MM-DD（含当天）
        in: query
        name: createdAtEnd
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或查询失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 分页查询主播列表
      tags:
      - LiveAnchorAdmin
  /live/anchor/permission/update:
    post:
      consumes:
      - application/json
      description: |-
        修改指定主播的直播、PK、推荐准入和运营提现权限，四个字段必须完整传入且只允许 0/1。
        livePermission=0 时不得开启 pkPermission；接口校验失败而不会偷偷联动修改。
        recommendPermission 表示是否允许进入推荐系统，与 isRecommended 人工推荐状态不同。
        本接口不修改主播状态、审核状态、推荐运营属性或风控状态。
      parameters:
      - description: 四项主播权限
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorPermissionUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限、权限冲突或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播功能权限
      tags:
      - LiveAnchorAdmin
  /live/anchor/profile/update:
    post:
      consumes:
      - application/json
      description: |-
        只允许修改公开资料以及 anchorType；level 第一版不开放人工调整。
        空字符串、0、空标签和 null 生日均按合法零值显式更新，不使用 Save 或 struct Updates。
        categoryId=0 表示清空分类；非 0 时必须来自当前启用的直播分类。
        审核、认证、状态、权限、推荐、签约、公会、风控、统计和来源均由独立接口或系统维护。
      parameters:
      - description: 后台资料白名单
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorAdminProfileUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 后台修改主播资料
      tags:
      - LiveAnchorAdmin
  /live/anchor/recommend/update:
    post:
      consumes:
      - application/json
      description: |-
        只修改人工推荐、新人期截止毫秒时间戳、人工排序和推荐基础权重。
        本接口不修改 recommendPermission；当推荐准入权限为 0 时，不能设置 isRecommended=1。
      parameters:
      - description: 运营推荐属性
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorRecommendUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限、推荐权限关闭或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播运营推荐属性
      tags:
      - LiveAnchorAdmin
  /live/anchor/remark/update:
    post:
      consumes:
      - application/json
      description: 只修改后台可见的 remark，按 UTF-8 字符数限制为 500；APP 的任何 Response DTO 均不包含该字段。
      parameters:
      - description: 主播 ID 和后台备注
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorRemarkUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播后台备注
      tags:
      - LiveAnchorAdmin
  /live/anchor/risk/update:
    post:
      consumes:
      - application/json
      description: |-
        只修改 riskLevel（0正常、1低、2中、3高），不联动状态或任何权限字段。
        实际能否开播由 live/check 实时综合判断；第一版高风险禁止开播，中风险不扩大限制。
      parameters:
      - description: 主播 ID 和风险等级
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorRiskUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播风险等级
      tags:
      - LiveAnchorAdmin
  /live/anchor/signed/update:
    post:
      consumes:
      - application/json
      description: 只修改 isSigned；签约状态不等同于 anchorType、agencyId 或认证状态，不做任何联动。
      parameters:
      - description: 主播 ID 和签约状态
