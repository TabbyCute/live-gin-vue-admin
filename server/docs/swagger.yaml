        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取后台直播分类树
      tags:
      - LiveCategoryAdmin
  /live/category/update:
    post:
      consumes:
      - application/json
      description: |-
        允许修改父分类、名称、图标和排序；稳定编码 code 不允许修改。
        修改父级时会检查父分类存在性、启用状态和循环引用。
      parameters:
