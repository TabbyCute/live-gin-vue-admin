          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播签约状态
      tags:
      - LiveAnchorAdmin
  /live/anchor/status/update:
    post:
      consumes:
      - application/json
      description: |-
        状态包括禁用(0)、正常(1)、封禁(2)、注销(3)。禁用和封禁必须填写原因。
        封禁时 banUntil=0 表示永久封禁，未来毫秒时间戳表示临时封禁；恢复正常会清空原因和 banUntil。
        注销只改变状态、不删除数据，且注销后不能通过本接口恢复。
      parameters:
      - description: 账号状态、原因和封禁截止时间
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorStatusUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无 RBAC 权限、非法状态或主播不存在
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改主播账号状态
      tags:
      - LiveAnchorAdmin
