        type: integer
      - description: 每页数量，最大 100
        in: query
        name: pageSize
        required: true
        type: integer
      - description: 分类编码或名称，模糊匹配
        in: query
        name: keyword
        type: string
      - description: 父分类 ID；0 表示只查询顶级分类
        in: query
        name: parentId
        type: integer
      - description: 状态：0停用 1启用
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、无权限或查询失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 无效
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 分页查询直播分类
      tags:
      - LiveCategoryAdmin
  /live/category/status/update:
    post:
      consumes:
      - application/json
      description: 停用父分类会在同一事务中级联停用全部子孙分类；启用子分类要求所有上级分类已启用。
