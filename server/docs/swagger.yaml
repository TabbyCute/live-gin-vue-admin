  /v1/app/live/anchor/apply:
    post:
      consumes:
      - application/json
      description: |-
        当前客户端账号首次申请时创建唯一主播记录；主播编号按“渠道号 + 六位序列”生成。
        审核中和已通过的申请不能重复提交；被拒后复用原记录和主播编号，清空上一轮审核结果后重新进入审核中。
        userId 始终取自客户端 JWT；channelId 只在首次申请时写入，重新申请不能改写来源渠道。
        categoryId=0 表示未分类；非 0 时必须来自当前启用的直播分类。
      parameters:
      - description: 主播申请资料，不包含 userId
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorApplyReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、正在审核或已经是主播
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 申请成为主播
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/apply/status:
    get:
      description: userId 只从客户端 JWT 获取。未创建主播记录时返回 isApplied=false、applyStatus=0。
      produces:
      - application/json
      responses:
        "200":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 获取当前用户的主播申请状态
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/detail:
    get:
      description: |-
        根据唯一对外编号 anchorNo 查询已审核通过且状态正常的主播，只返回公开资料。
        客户端请求和响应均不暴露 LiveAnchor 数据库主键；同时不返回完整生日、userId、审核信息、封禁原因、提现权限、风控、备注、来源 ID 或扩展字段。
      parameters:
      - description: 主播对外编号
        in: query
        name: anchorNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、主播不存在或不可公开
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取主播公共主页资料
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/info:
    get:
      description: |-
        从客户端 JWT 获取当前账号 ID，并实时查询主播记录；客户端不能传 userId。
        尚未创建主播记录时返回 isAnchor=false、anchor=null，不把 record not found 当成接口错误。
        响应使用独立 DTO，不返回审核管理员、风控、后台备注、来源 ID 或扩展字段。
      produces:
      - application/json
      responses:
        "200":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 获取当前用户的主播身份
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/live/check:
    get:
      description: |-
        实时检查主播存在、申请通过、账号状态、封禁、风险等级、直播权限和当前认证策略。
        高风险主播禁止开播；中风险第一版不扩大限制；认证第一版不是开播硬条件。
        临时封禁已到期但 status 尚未恢复时仍拒绝，本 GET 接口不会隐式修改数据库。
      produces:
      - application/json
      responses:
        "200":
          description: 检查失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 检查当前主播开播资格
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/pk/check:
    get:
      description: |-
        PK 资格严格建立在完整开播资格之上；通过直播检查后再判断 pkPermission。
        本接口只判断资格，不创建直播间、LiveKit room 或 PK session。
      produces:
      - application/json
      responses:
        "200":
          description: 检查失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 检查当前主播 PK 资格
      tags:
      - LiveAnchorApp
  /v1/app/live/anchor/profile/update:
    post:
      consumes:
      - application/json
      description: |-
        只允许修改昵称、头像、封面、签名、性别、生日、地区、语言、分类和标签。
        userId 从 JWT 获取；请求中的空字符串、0、空标签和 null 生日均按合法零值显式更新。
        categoryId=0 表示清空分类；非 0 时必须来自当前启用的直播分类。
        本接口不能修改主播编号、审核、状态、权限、认证、运营、统计、来源、风控和后台备注字段。
      parameters:
      - description: 公开资料白名单
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.AnchorProfileUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、主播不存在或修改失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 修改当前主播公开资料
      tags:
      - LiveAnchorApp
  /v1/app/live/category/list:
    get:
      description: |-
        公开接口，只返回启用分类；父分类停用后，其子分类不会出现在客户端分类树中。
        分类 id 是主播 categoryId 的公开合法取值，不属于需要隐藏的主播数据库主键。
      produces:
      - application/json
      responses:
        "200":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取启用的直播分类树
      tags:
      - LiveCategoryApp
  /v1/app/live/user/info:
    get:
      description: 从客户端 JWT 上下文获取账号 ID，并返回安全账号信息
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AccountResponse'
              type: object
        "401":
          description: 客户端 token 缺失、无效或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - AppBearerAuth: []
      summary: 获取当前客户端账号
      tags:
      - LiveAccount
  /v1/app/live/user/login:
    post:
      consumes:
      - application/json
      description: 校验客户端账号密码并签发客户端专用 JWT
      parameters:
      - description: 用户名和密码
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/tb_live_module_model_live_request.Login'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误、凭证错误或账号禁用
          schema:
            $ref: '#/definitions/response.Response'
      summary: 客户端账号登录
      tags:
      - LiveAccount
  /v1/app/live/user/register:
    post:
      consumes:
      - application/json
      description: 创建独立于管理后台账号体系的客户端账号；用户名不区分大小写
      parameters:
      - description: 用户名、密码、昵称和头像
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/tb_live_module_model_live_request.Register'
      produces:
      - application/json
      responses:
        "200":
          description: 参数错误或用户名已注册
          schema:
            $ref: '#/definitions/response.Response'
      summary: 客户端账号注册
      tags:
      - LiveAccount
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: x-token
    type: apiKey
  AppBearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- name: Base
- description: 用户
  name: SysUser
