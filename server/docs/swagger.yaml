          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 启用或停用直播分类
      tags:
      - LiveCategoryAdmin
  /live/category/tree:
    get:
      description: 返回全部未删除分类，包括停用分类，供父分类选择器和分类管理页面使用。
