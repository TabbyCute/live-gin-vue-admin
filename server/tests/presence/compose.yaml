services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:${PRESENCE_REDIS_PORT:-18479}:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 20
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: presence-test-only
      MYSQL_DATABASE: presence_test
    ports: ['127.0.0.1:${PRESENCE_MYSQL_PORT:-15436}:3306']
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -ppresence-test-only]
      interval: 2s
      timeout: 2s
      retries: 30
