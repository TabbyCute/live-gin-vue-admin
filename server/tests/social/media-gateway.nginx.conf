# 样例必须合并进真实HTTPS server块，不能直接覆盖部署配置。
# 只接入HLS。APP播放器的每个playlist/segment请求都需发送：
# Authorization: Bearer <APP token>
# X-Playback-Token: <playback接口playUrl中playbackToken参数>
# hls.js通过xhrSetup/fetchSetup注入上述Header；原生HLS无法注入Header时不支持。
# 源站SRS的HTTP/RTMP/WebRTC播放端口仅允许可信网关访问。不能公网开放源站。
# 禁止对鉴权子请求或媒体对象跨用户复用缓存；实际CDN必须同等逐请求验权。

location = /_social_media_auth {
    internal;
    proxy_pass http://127.0.0.1:8888/api/v1/app/live/room/playback/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Playback-Token $http_x_playback_token;
    proxy_set_header X-Media-Path $media_path;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_cache off;
    access_log off;
}

# live必须与live.srs.app一致。仅允许SRS默认同目录stream-N.ts切片命名。
location ~ ^/live/[A-Za-z0-9_-]+\.(m3u8|ts)$ {
    set $media_path $uri;
    set $args ""; # 不向SRS转发播放凭证query
    auth_request /_social_media_auth;
    proxy_pass http://srs_private_origin:8080;
    proxy_set_header Authorization "";
    proxy_set_header X-Playback-Token "";
    proxy_cache off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    add_header Cache-Control "private, no-store" always;
    access_log off;
}
# 受保护媒体不得通过FLV/WebRTC/RTMP绕过；这些协议需另行实现会话级撤销与最大寿命。
location /live/ { return 403; }
