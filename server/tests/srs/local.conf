# Isolated local smoke configuration: no callbacks, no production mounts.
listen 1935;
daemon off;
pid /tmp/srs-smoke.pid;
srs_log_tank console;
max_connections 20;
http_api {
    enabled on;
    listen 1985;
}
http_server {
    enabled on;
    listen 8080;
    dir /usr/local/srs/objs/nginx/html;
}
vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;
    http_hooks { enabled off; }
    hls { enabled off; }
    http_remux {
        enabled on;
        mount /[app]/[stream].flv;
    }
}
