<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主播客户端测试</title>
  <style>
    body { max-width: 900px; margin: 20px auto; padding: 0 12px; font: 14px/1.5 sans-serif; }
    label { display: block; margin: 8px 0; }
    input, textarea, select, button { box-sizing: border-box; padding: 6px; }
    input, textarea, select { width: 100%; }
    textarea { min-height: 74px; }
    #profile { min-height: 260px; font-family: monospace; }
    button { margin: 4px 4px 4px 0; }
    pre { min-height: 220px; padding: 10px; overflow: auto; background: #eee; white-space: pre-wrap; }
    .ok { color: green; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h2>主播客户端</h2>
  <p><a href="html-1注册账号.html">返回账号页</a>（先登录获取客户端 Token）</p>

  <label>API 基址
    <input id="baseUrl" value="http://127.0.0.1:8888/api/v1">
  </label>
  <label>Bearer Token
    <textarea id="token" placeholder="会读取账号页保存的 Token，也可手动粘贴"></textarea>
  </label>
  <button id="saveConfig">保存配置</button>

  <fieldset>
    <legend>直播分类</legend>
    <label>启用分类
      <select id="categorySelect">
        <option value="0">未分类</option>
      </select>
    </label>
    <button id="loadCategories">加载启用分类</button>
    <small>选择后会自动更新下方主播资料 JSON 中的 categoryId。</small>
  </fieldset>

  <fieldset>
    <legend>主播资料 JSON</legend>
    <textarea id="profile">{
  "nickname": "Alice",
  "avatar": "https://example.com/avatar.png",
  "cover": "https://example.com/cover.png",
  "signature": "欢迎来到我的直播间",
  "gender": 2,
  "birthday": "1998-01-01",
  "countryCode": "MY",
  "regionCode": "10",
  "cityCode": "1001",
  "language": "ms-MY",
  "categoryId": 0,
  "tagIds": [1, 3, 8],
  "channelId": 1
}</textarea>
    <button id="apply">提交 / 重新申请</button>
    <button id="updateProfile">更新资料</button>
    <small>更新资料时会自动移除 channelId。birthday 可设为 null。</small>
  </fieldset>

  <fieldset>
    <legend>当前主播</legend>
    <button id="applyStatus">申请状态</button>
    <button id="info">我的主播资料</button>
    <button id="liveCheck">开播资格</button>
    <button id="pkCheck">PK 资格</button>
  </fieldset>

  <fieldset>
    <legend>公开主页</legend>
    <label>anchorNo <input id="anchorNo" placeholder="申请或查询后自动填充"></label>
    <button id="detail">查询公开资料</button>
  </fieldset>

  <p id="status"></p>
  <pre id="output">等待请求</pre>

  <script>
    const $ = id => document.getElementById(id);
    const BASE_KEY = 'liveTest.baseUrl';
    const TOKEN_KEY = 'liveTest.token';

    $('baseUrl').value = localStorage.getItem(BASE_KEY) || $('baseUrl').value;
    $('token').value = localStorage.getItem(TOKEN_KEY) || '';

    function value(id) {
      return $(id).value.trim();
    }

    function saveConfig() {
      localStorage.setItem(BASE_KEY, value('baseUrl').replace(/\/$/, ''));
      localStorage.setItem(TOKEN_KEY, value('token'));
    }

    function readProfile() {
      try {
        return JSON.parse($('profile').value);
      } catch (error) {
        throw new Error('主播资料 JSON 格式错误: ' + error.message);
      }
    }

    function fillAnchorNo(result) {
      const anchorNo = result?.data?.anchorNo || result?.data?.anchor?.anchorNo;
      if (anchorNo) $('anchorNo').value = anchorNo;
    }

    function flattenCategories(items, depth = 0) {
      return (items || []).flatMap(item => [
        { id: item.id, label: '　'.repeat(depth) + item.name + ' (' + item.code + ')' },
        ...flattenCategories(item.children, depth + 1)
      ]);
    }

    function fillCategoryOptions(result) {
      const select = $('categorySelect');
      const currentId = Number(readProfile().categoryId || 0);
      select.innerHTML = '<option value="0">未分类</option>';
      for (const item of flattenCategories(result?.data)) {
        const option = document.createElement('option');
        option.value = String(item.id);
        option.textContent = item.label;
        select.appendChild(option);
      }
      select.value = String(currentId);
    }

    async function request(path, options = {}) {
      saveConfig();
      const url = value('baseUrl').replace(/\/$/, '') + path;
      const headers = { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers };
      if (options.auth !== false) {
        if (!value('token')) throw new Error('请先在账号页登录，或手动粘贴 Token');
        headers.Authorization = 'Bearer ' + value('token');
      }
      delete options.auth;
      $('status').className = '';
      $('status').textContent = `${options.method || 'GET'} ${url}`;
      try {
        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        let result;
        try { result = JSON.parse(text); } catch { result = text; }
        $('status').className = response.ok && result?.code === 0 ? 'ok' : 'error';
        $('status').textContent += ` -> HTTP ${response.status}`;
        $('output').textContent = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
        fillAnchorNo(result);
        return result;
      } catch (error) {
        $('status').className = 'error';
        $('output').textContent = error.stack || error.message;
        throw error;
      }
    }

    function run(action) {
      Promise.resolve().then(action).catch(error => {
        $('status').className = 'error';
        $('output').textContent = error.stack || error.message;
      });
    }

    $('saveConfig').onclick = () => {
      saveConfig();
      $('status').className = 'ok';
      $('status').textContent = '配置已保存';
    };
    $('loadCategories').onclick = () => run(async () => {
      const result = await request('/app/live/category/list', { auth: false });
      if (result?.code === 0) fillCategoryOptions(result);
      return result;
    });
    $('categorySelect').onchange = () => run(() => {
      const profile = readProfile();
      profile.categoryId = Number(value('categorySelect'));
      $('profile').value = JSON.stringify(profile, null, 2);
      $('status').className = 'ok';
      $('status').textContent = '已更新主播资料 categoryId';
    });
    $('apply').onclick = () => run(() => request('/app/live/anchor/apply', {
      method: 'POST', body: JSON.stringify(readProfile())
    }));
    $('updateProfile').onclick = () => run(() => {
      const profile = readProfile();
      delete profile.channelId;
      return request('/app/live/anchor/profile/update', {
        method: 'POST', body: JSON.stringify(profile)
      });
    });
    $('applyStatus').onclick = () => run(() => request('/app/live/anchor/apply/status'));
    $('info').onclick = () => run(() => request('/app/live/anchor/info'));
    $('liveCheck').onclick = () => run(() => request('/app/live/anchor/live/check'));
    $('pkCheck').onclick = () => run(() => request('/app/live/anchor/pk/check'));
    $('detail').onclick = () => run(() => {
      if (!value('anchorNo')) throw new Error('请输入 anchorNo');
      return request('/app/live/anchor/detail?anchorNo=' + encodeURIComponent(value('anchorNo')), { auth: false });
    });
  </script>
</body>
</html>
