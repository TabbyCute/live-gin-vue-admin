<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主播直播间测试</title>
  <style>
    body { max-width: 900px; margin: 20px auto; padding: 0 12px; font: 14px/1.5 sans-serif; }
    label { display: block; margin: 8px 0; }
    input, textarea, select, button { box-sizing: border-box; padding: 6px; }
    input, textarea, select { width: 100%; }
    textarea { min-height: 74px; }
    button { margin: 4px 4px 4px 0; }
    pre { min-height: 220px; padding: 10px; overflow: auto; background: #eee; white-space: pre-wrap; }
    .ok { color: green; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h2>主播直播间</h2>
  <p>
    <a href="html-2申请主播.html">返回主播申请页</a>　
    <a href="html-4主播开播.html">进入主播开播页</a>　
    <a href="html-1注册账号.html">返回账号页</a>
  </p>
  <p>主播申请审核通过后会自动创建直播间，默认 <code>roomNo = anchorNo</code>；本页只维护直播间资料和房间状态，准备开播、场次及 SRS 联调已经移到独立开播页。</p>

  <label>API 基址
    <input id="baseUrl" value="http://127.0.0.1:8888/api/v1">
  </label>
  <label>Bearer Token
    <textarea id="token" placeholder="会读取账号页保存的 Token，也可手动粘贴"></textarea>
  </label>
  <button id="saveConfig">保存配置</button>

  <fieldset>
    <legend>直播间资料</legend>
    <label>roomNo
      <input id="roomNo" maxlength="32" placeholder="审核通过后默认为主播编号，查询后自动填充">
    </label>
    <label>直播分类
      <select id="categorySelect">
        <option value="0">未分类</option>
      </select>
    </label>
    <button id="loadCategories">加载启用分类</button>
    <label>直播标题 <input id="roomTitle" maxlength="128" value="Alice 的直播间"></label>
    <label>直播封面 <input id="roomCover" maxlength="500" value="https://example.com/live-cover.png"></label>
    <label>直播公告 <textarea id="roomNotice" maxlength="500">欢迎进入直播间</textarea></label>
    <label>可见范围
      <select id="visibility">
        <option value="1">公开</option>
        <option value="2">仅关注者</option>
        <option value="0">私密</option>
      </select>
    </label>
    <button id="roomInfo">我的直播间</button>
    <button id="saveRoom">保存直播间资料</button>
    <button id="closeRoom">主播关闭直播间</button>
    <button id="openRoom">主播恢复直播间</button>
  </fieldset>

  <fieldset>
    <legend>公开直播间查询</legend>
    <button id="publicRoomDetail">按 roomNo 查询公开直播间</button>
    <button id="publicRoomList">公开直播列表</button>
    <small>公开详情可以查询未开播的正常公开房间；latestSession 有活动场次时返回当前场次，否则返回最近一次已结束直播，从未完成直播时返回空对象 {}。公开列表仍只展示直播中的房间。</small>
  </fieldset>

  <p id="status"></p>
  <pre id="output">等待请求</pre>

  <script>
    const $ = id => document.getElementById(id);
    const BASE_KEY = 'liveTest.baseUrl';
    const TOKEN_KEY = 'liveTest.token';

    $('baseUrl').value = localStorage.getItem(BASE_KEY) || $('baseUrl').value;
    $('token').value = localStorage.getItem(TOKEN_KEY) || '';

    function value(id) {
      return $(id).value.trim();
    }

    function saveConfig() {
      localStorage.setItem(BASE_KEY, value('baseUrl').replace(/\/$/, ''));
      localStorage.setItem(TOKEN_KEY, value('token'));
    }

    function fillRoomFields(result) {
      const data = result && result.data ? result.data : {};
      const room = data.room || data;
      if (room.roomNo) $('roomNo').value = room.roomNo;
      if (room.categoryId !== undefined) $('categorySelect').value = String(room.categoryId);
      if (room.title) $('roomTitle').value = room.title;
      if (room.coverUrl) $('roomCover').value = room.coverUrl;
      if (room.notice !== undefined) $('roomNotice').value = room.notice;
      if (room.visibility !== undefined) $('visibility').value = String(room.visibility);
    }

    function flattenCategories(items, depth = 0) {
      return (items || []).flatMap(item => [
        { id: item.id, label: '　'.repeat(depth) + item.name + ' (' + item.code + ')' },
        ...flattenCategories(item.children, depth + 1)
      ]);
    }

    function fillCategoryOptions(result) {
      const select = $('categorySelect');
      const currentId = select.value || '0';
      select.innerHTML = '<option value="0">未分类</option>';
      for (const item of flattenCategories(result && result.data)) {
        const option = document.createElement('option');
        option.value = String(item.id);
        option.textContent = item.label;
        select.appendChild(option);
      }
      select.value = currentId;
    }

    async function request(path, options = {}) {
      saveConfig();
      const url = value('baseUrl').replace(/\/$/, '') + path;
      const headers = { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers };
      if (options.auth !== false) {
        if (!value('token')) throw new Error('请先在账号页登录，或手动粘贴 Token');
        headers.Authorization = 'Bearer ' + value('token');
      }
      delete options.auth;
      $('status').className = '';
      $('status').textContent = (options.method || 'GET') + ' ' + url;
      try {
        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        let result;
        try { result = JSON.parse(text); } catch { result = text; }
        $('status').className = response.ok && result && result.code === 0 ? 'ok' : 'error';
        $('status').textContent += ' -> HTTP ' + response.status;
        $('output').textContent = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
        fillRoomFields(result);
        return result;
      } catch (error) {
        $('status').className = 'error';
        $('output').textContent = error.stack || error.message;
        throw error;
      }
    }

    function run(action) {
      Promise.resolve().then(action).catch(error => {
        $('status').className = 'error';
        $('output').textContent = error.stack || error.message;
      });
    }

    function roomPayload() {
      return {
        categoryId: Number(value('categorySelect') || 0),
        title: value('roomTitle'),
        coverUrl: value('roomCover'),
        notice: value('roomNotice'),
        visibility: Number(value('visibility'))
      };
    }

    $('saveConfig').onclick = () => {
      saveConfig();
      $('status').className = 'ok';
      $('status').textContent = '配置已保存';
    };
    $('loadCategories').onclick = () => run(async () => {
      const result = await request('/app/live/category/list', { auth: false });
      if (result && result.code === 0) fillCategoryOptions(result);
      return result;
    });
    $('roomInfo').onclick = () => run(() => request('/app/live/room/info'));
    $('saveRoom').onclick = () => run(() => request('/app/live/room/save', {
      method: 'POST',
      body: JSON.stringify(roomPayload())
    }));
    $('closeRoom').onclick = () => run(() => request('/app/live/room/status/update', {
      method: 'POST',
      body: JSON.stringify({ status: 2 })
    }));
    $('openRoom').onclick = () => run(() => request('/app/live/room/status/update', {
      method: 'POST',
      body: JSON.stringify({ status: 1 })
    }));
    $('publicRoomDetail').onclick = () => run(() => {
      if (!value('roomNo')) throw new Error('请先查询直播间或填写 roomNo');
      return request('/app/live/room/detail?roomNo=' + encodeURIComponent(value('roomNo')), { auth: false });
    });
    $('publicRoomList').onclick = () => run(() => request('/app/live/room/list?page=1&pageSize=20', { auth: false }));
  </script>
</body>
</html>
